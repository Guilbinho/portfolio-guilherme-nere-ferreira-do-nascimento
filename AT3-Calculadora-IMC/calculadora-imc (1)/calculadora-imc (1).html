<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
</head>
<body>
    <h1>Calculadora de IMC</h1>

    <label for="peso">Peso (kg):</label>
    <input id="peso" type="number" step="0.1" placeholder="Ex: 70"><br><br>

    <label for="altura">Altura (m):</label>
    <input id="altura" type="number" step="0.01" placeholder="Ex: 1.75"><br><br>

    <button type="button" onclick="calcularIMC()">CALCULAR</button>

    <p id="resultado"></p>

    <script>
        function calcularIMC() {
            var peso, altura, imc, classificacao;

            peso = document.getElementById("peso").value;
            altura = document.getElementById("altura").value;

            if (isNaN(peso) || isNaN(altura) || peso <= 0 || altura <= 0) {
                document.getElementById("resultado").innerHTML = "Entrada Inválida";
                return;
            }

            imc = peso / (altura * altura);

            if (imc < 18.5) {
                classificacao = "Baixo peso";
            } else if (imc < 25) {
                classificacao = "Peso normal";
            } else if (imc < 30) {
                classificacao = "Sobrepeso";
            } else if (imc < 35) {
                classificacao = "Obesidade grau I";
            } else if (imc < 40) {
                classificacao = "Obesidade grau II";
            } else {
                classificacao = "Obesidade grau III (mórbida)";
            }

            document.getElementById("resultado").innerHTML =
                "Seu IMC é " + imc.toFixed(2) + " kg/m² - " + classificacao;
        }
    </script>
</body>
</html>
